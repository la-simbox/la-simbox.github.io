<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RK7 Team · Bilan de course</title>
<meta name="description" content="Le bilan de course de la RK7 Team : résultat, heures en piste et photos.">
<meta name="theme-color" content="#0C0C0B">
<meta property="og:title" content="RK7 Team · Bilan de course">
<meta property="og:description" content="Le bilan de course de la RK7 Team : résultat, heures en piste et photos.">
<meta property="og:image" content="img/icon-512.png">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Vitrine publique RK7 : bandeau noir et or, chiffres clés, palmarès, équipes, calendrier, photos, contact */
:root{--bg:#0C0C0B;--panel:#151513;--line:#2c2a25;--ink:#F5F3EC;--muted:#B0AB9D;--gold:#D4AF37;--gold2:#A9821A;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--gold)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:relative;overflow:hidden;isolation:isolate;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
header::before{content:"";position:absolute;z-index:-1;right:-200px;top:-60px;width:420px;height:520px;background:linear-gradient(115deg,transparent 0 34%,var(--gold) 34% 46%,transparent 46% 54%,#3a3220 54% 62%,transparent 62%);transform:skewX(-18deg);opacity:.28}
header::after{content:"";position:absolute;z-index:-1;left:0;bottom:0;width:100%;height:24px;opacity:.08;background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/24px 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px 0;gap:12px}
.top a.btn{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold);border-radius:6px;padding:6px 12px}
.hero{padding-block:36px 52px;display:flex;flex-direction:column;gap:14px;max-width:720px}
.hero img{width:min(320px,70vw);height:auto}
.eyebrow{font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,9vw,76px);line-height:.92;margin:0;letter-spacing:.01em}
h1 span{color:var(--gold)}
.lead{color:var(--muted);font-size:18px;max-width:60ch;margin:0;white-space:pre-line}
main{display:flex;flex-direction:column;gap:56px;padding-block:44px 64px}
h2{font-family:var(--display);font-weight:700;font-size:34px;margin:0 0 16px;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:28px;height:6px;background:var(--gold);transform:skewX(-25deg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row .d{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.row b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.01em;display:block;line-height:1.1}
.row small{color:var(--muted);font-size:14px}
.pos{font-family:var(--display);font-weight:700;font-size:30px;color:var(--gold);text-align:right}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.team{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:22px;font-weight:600}
.team:hover,.team:focus-visible{border-color:var(--gold)}
.team span{color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--panel);display:block}
.cta{background:linear-gradient(135deg,#1a1710,#0f0f0d);border:1px solid var(--gold2);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.cta p{margin:0;color:var(--muted)}
.cta .c{font-size:18px;color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns a{font-weight:600;text-decoration:none;border-radius:8px;padding:12px 16px;border:1px solid var(--gold)}
.btns a.p{background:var(--gold);color:#121210}
.empty{color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:14px}
a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:560px){.row{grid-template-columns:70px minmax(0,1fr)} .pos{grid-column:2;text-align:left;font-size:24px}}

[hidden]{display:none!important}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px}.f.w{grid-column:1/-1}
.f label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{font:inherit;color:var(--ink);background:#0f0f0d;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.f textarea{min-height:110px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
button.send{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:8px;padding:12px 18px;background:var(--gold);color:#121210;cursor:pointer}
button.send:disabled{opacity:.6}
.msg{margin:0;min-height:1.5em}.msg.err{color:#ff8a7a}.msg.ok{color:#8fe08a}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pt b{font-family:var(--display);font-size:22px;font-weight:600}
.pt span{color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(56px,16vw,110px);line-height:.9;color:var(--gold)}
@media (max-width:560px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><span class="eyebrow">Bilan de course</span><a class="btn" href="equipe.html">L'équipe</a></div>
    <div class="hero">
      <img src="img/logo-rk7.png" alt="RK7 Team" width="334" height="174">
      <span class="eyebrow" id="when"></span>
      <h1 id="titre">Chargement…</h1>
      <p class="lead" id="sub"></p>
    </div>
  </div>
</header>
<main class="wrap">
  <section aria-labelledby="hRes" id="secRes" hidden><h2 id="hRes">Résultat</h2><div class="big" id="pos"></div><p class="lead" id="com" style="margin-top:10px"></p></section>
  <section aria-labelledby="hChif"><h2 id="hChif">En chiffres</h2><div class="stats" id="stats"></div></section>
  <section aria-labelledby="hPh" id="secPh" hidden><h2 id="hPh">En images</h2><div class="gal" id="gal"></div></section>
  <section aria-labelledby="hSai" id="secSai" hidden><h2 id="hSai">La saison</h2><div class="stats" id="sai"></div></section>
  <section class="cta" aria-labelledby="hMerci"><h2 id="hMerci" style="margin:0">Merci à nos partenaires</h2>
    <p id="parts">Votre soutien nous permet de rouler. Merci !</p>
    <div class="c" id="contact"></div>
    <div class="btns"><a class="p" href="partenaires.html">Espace partenaires</a><a href="equipe.html">Découvrir l'équipe</a></div>
  </section>
</main>
<footer class="wrap">RK7 Team · association loi 1901</footer>
<script>
(async function(){
  const AUTH="https://ep-spring-voice-b9slst0q.neonauth.c-7.eu-central-1.aws.neon.tech/neondb/auth";
  const REST="https://ep-spring-voice-b9slst0q.apirest.c-7.eu-central-1.aws.neon.tech/neondb/rest/v1";
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const M=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const day=d=>{ const [y,m,dd]=d.split("-").map(Number); return dd+" "+M[m-1]+" "+y; };
  let jwt;
  async function rpc(n,a){ if(!jwt) jwt=(await (await fetch(AUTH+"/token/anonymous")).json()).token;
    const r=await fetch(REST+"/rpc/"+n,{method:"POST",headers:{authorization:"Bearer "+jwt,"content-type":"application/json","content-profile":"api","accept-profile":"api"},body:JSON.stringify(a||{})});
    if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){} throw new Error(m||"Erreur de connexion, réessaie."); } return r.json(); }
  const id=new URLSearchParams(location.search).get("c")||"";
  try{
    const d=await rpc("public_bilan",{course_id:id}), c=d.course;
    document.title="RK7 Team · Bilan "+c.titre;
    $("#when").textContent=(c.date?day(c.date):"Saison "+c.saison)+(c.equipe?" · "+c.equipe:"");
    $("#titre").textContent=c.titre; $("#sub").textContent=[c.lieu, c.duree?c.duree+" d'endurance":""].filter(Boolean).join(" · ");
    if(c.position){ $("#secRes").hidden=false; $("#pos").textContent=c.position; } if(c.commentaire){ $("#secRes").hidden=false; $("#com").textContent=c.commentaire; }
    const st=[[c.heures?Math.round(c.heures*10)/10+" h":null,"En piste"],[c.nbEquipes,"Équipes au départ"],[c.pilotes||null,"Pilotes RK7"],[c.points,"Points SWS"]].filter(x=>x[0]!=null&&x[0]!=="");
    $("#stats").innerHTML=st.map(x=>'<div class="stat"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join("");
    const s=d.saison||{}; if(s.courses){ $("#secSai").hidden=false; $("#sai").innerHTML=[[s.courses,"Courses "+c.saison],[Math.round(s.heures)+" h","D'endurance"],[s.podiums,"Podiums"]].filter(x=>x[0]!==0).map(x=>'<div class="stat"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join(""); }
    if((d.partenaires||[]).length) $("#parts").textContent="Merci à "+d.partenaires.join(", ")+" : votre soutien nous permet de rouler !";
    if(d.contact) $("#contact").textContent=d.contact;
    const ph=d.photos||[]; if(ph.length){ $("#secPh").hidden=false; $("#gal").innerHTML=ph.map((p,i)=>'<img alt="RK7 Team en course, photo '+(i+1)+'" data-id="'+esc(p.thumb)+'">').join("");
      for(const im of document.querySelectorAll("#gal img")){ try{ const r=await rpc("public_image",{image_id:im.dataset.id}); im.src="data:"+r.type+";base64,"+r.b64; }catch(e){ im.remove(); } } }
  }catch(e){ $("#titre").textContent="Bilan indisponible"; $("#sub").textContent="Ce bilan n'existe pas ou la course n'est pas encore terminée."; }
})();
</script>
</body>
</html>
