<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visuel SimBox</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--ink:#f4f4f6}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0a0a0d;--ink:#f4f4f6}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:12px}
canvas{width:100%;height:auto;border-radius:12px;display:block}
pre{white-space:pre-wrap;background:#16161b;border-radius:12px;padding:14px;margin:0}
a{color:#ff5a4f}
</style></head><body><main>
<canvas id="cv" width="1080" height="1350" aria-label="Visuel SimBox"></canvas>
<pre id="txt"></pre>
<p style="margin:0;color:#9a9aa4;font-size:13px">Visuel généré depuis l'<a href="./">Espace pilotes</a>.</p>
</main>
<script src="visuels.js"></script>
<script>
(async () => {
  const AUTH = "https://ep-bold-paper-b90hj6av.neonauth.c-7.eu-central-1.aws.neon.tech/neondb/auth";
  const REST = "https://ep-bold-paper-b90hj6av.apirest.c-7.eu-central-1.aws.neon.tech/neondb/rest/v1";
  const q = new URLSearchParams(location.search);
  const tok = (await (await fetch(AUTH + "/token/anonymous")).json()).token;
  const rpc = async (n, a) => { const r = await fetch(REST + "/rpc/" + n, { method: "POST", headers: { authorization: "Bearer " + tok, "content-type": "application/json", "content-profile": "api", "accept-profile": "api" }, body: JSON.stringify(a || {}) }); if (!r.ok) throw new Error(n + " " + r.status); return r.json(); };
  try {
    const data = await rpc("public_data", {});
    const spec = { type: q.get("type") || "classement" };
    if (q.get("event")) { spec.event = await rpc("social_event", { id: +q.get("event") }); spec.type = spec.event.kind; }
    if (spec.type === "soiree") spec.night = await rpc("night_laps", q.get("jour") ? { day: q.get("jour") } : {});
    await SimboxVisuel.render(document.getElementById("cv"), spec, data);
    const cap = SimboxVisuel.caption(spec, data);
    document.getElementById("txt").textContent = cap;
    window.visuel = { ready: true, title: SimboxVisuel.title(spec), caption: cap, png: () => document.getElementById("cv").toDataURL("image/png") };
  } catch (e) { document.getElementById("txt").textContent = "Erreur : " + e.message; window.visuel = { ready: true, error: e.message }; }
})();
</script></body></html>
